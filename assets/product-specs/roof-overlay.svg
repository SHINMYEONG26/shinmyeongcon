<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">덧방용 칼라강판 0.45T 등록 규격 안내</title><desc id="desc">판매 옵션을 바탕으로 제작한 규격 안내도입니다. 실제 측정 도면이 아니며 폭과 유효폭은 별도 확인이 필요합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4 8 8" fill="none" stroke="#b18b47" stroke-width="1.6"/></marker><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.name{font-size:35px;font-weight:700;fill:#102f43}.label{font-size:18px;fill:#687c89}.value{font-size:22px;font-weight:700;fill:#183647}.note{font-size:18px;fill:#687c89}</style></defs><rect width="1200" height="850" fill="#fff"/><rect x="0" y="0" width="1200" height="12" fill="#102f43"/><text x="62" y="82" font-size="14" fill="#9b773c" letter-spacing="3">SHINMYEONG · SIZE &amp; OPTIONS</text><text x="62" y="184" class="name">덧방용 칼라강판 0.45T</text><text x="62" y="120" font-size="18" fill="#687c89">등록 규격 안내 · 실측 도면 아님</text><rect x="62" y="254" width="590" height="440" rx="4" fill="#f3f6f8"/><path d="M185 340 430 285 570 525 325 580Z" fill="#28485b" stroke="#102f43" stroke-width="3"/><path d="m185 340 140 240 245-55v12l-245 55-140-240z" fill="#102f43"/><g stroke="#7391a2" stroke-width="3" opacity=".7"><path d="m245 326 140 240"/><path d="m305 312 140 240"/><path d="m365 299 140 240"/></g><line x1="150" y1="340" x2="290" y2="580" stroke="#b18b47" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="92" y="470" transform="rotate(-60 92 470)" font-size="20" fill="#9b773c">제품 치수 별도 확인</text><line x1="198" y1="304" x2="418" y2="255" stroke="#b18b47" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="280" y="288" font-size="18" fill="#9b773c">폭 · 유효폭 확인</text><text x="356" y="650" text-anchor="middle" class="note">설명용 형상 · 실제 비례와 다름</text><text x="704" y="300" class="label">두께·구성 옵션</text><text x="704" y="335" class="value">0.45T</text><text x="704" y="406" class="label">선택 가능한 형상</text><text x="704" y="441" class="value">V115 · V250(덧방용) · V330</text><text x="704" y="512" class="label">폭 · 유효폭</text><text x="704" y="547" class="value">별도 확인 필요</text><text x="704" y="618" class="label">포장·종류</text><text x="704" y="653" class="value">색상·규격별 옵션 확인</text><line x1="62" y1="738" x2="1138" y2="738" stroke="#dce4ea"/><text x="62" y="780" class="note">수치는 등록된 옵션만 표시했습니다. 골 간격·골 높이·시공 유효폭은 발주 전 확인해 주세요.</text><text x="62" y="812" font-size="16" fill="#9b773c">납품·시공 상담 010-7502-2856</text></svg>