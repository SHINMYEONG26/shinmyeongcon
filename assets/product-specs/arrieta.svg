<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1069" viewBox="0 0 1200 1069" role="img" aria-labelledby="title desc"><title id="title">아리에따 메탈사이딩 규격 안내</title><desc id="desc">길이 3,000 mm, 시공폭 (B) 380 mm, 전체폭 (C) 411 mm, 패널 두께 16 mm, 포장 수량 8장 / BOX, 시공 면적 1.14 ㎡ / 장, 제품 무게 약 4.1 kg / 장</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ae8439"/></marker></defs><rect width="1200" height="1069" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="80" y="65" font-size="17" fill="#9b742f" text-anchor="start">SHINMYEONG CONSTRUCTION</text><text x="80" y="120" font-size="38" fill="#14364b" text-anchor="start">아리에따 메탈사이딩 규격 안내</text><text x="80" y="163" font-size="20" fill="#587082" text-anchor="start">제조사 공개 규격 기준 · 단위 mm · 형상 이해를 위한 개념도 (비례 아님)</text><rect x="180" y="280" width="740" height="140" fill="#e6edf2" stroke="#214b61" stroke-width="4"/><path d="M180 308H920" stroke="#a2b7c5" stroke-width="2"/><path d="M180 336H920" stroke="#a2b7c5" stroke-width="2"/><path d="M180 364H920" stroke="#a2b7c5" stroke-width="2"/><path d="M180 392H920" stroke="#a2b7c5" stroke-width="2"/><path d="M180 240L920 240" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="550" y="225" font-size="24" fill="#805a19" text-anchor="middle">길이 3,000 mm</text><path d="M955 280L955 420" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="973" y="350" font-size="24" fill="#805a19" text-anchor="start">시공폭 380 mm</text><text x="600" y="495" font-size="27" fill="#214b61" text-anchor="middle">전체폭 411 mm · 패널 두께 16 mm</text><rect x="80" y="578" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="610" font-size="22" fill="#14364b" text-anchor="start">길이</text><text x="550" y="610" font-size="23" fill="#14364b" text-anchor="start">3,000 mm</text><rect x="80" y="625" width="1040" height="47" fill="#fff"/><text x="105" y="657" font-size="22" fill="#14364b" text-anchor="start">시공폭 (B)</text><text x="550" y="657" font-size="23" fill="#14364b" text-anchor="start">380 mm</text><rect x="80" y="672" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="704" font-size="22" fill="#14364b" text-anchor="start">전체폭 (C)</text><text x="550" y="704" font-size="23" fill="#14364b" text-anchor="start">411 mm</text><rect x="80" y="719" width="1040" height="47" fill="#fff"/><text x="105" y="751" font-size="22" fill="#14364b" text-anchor="start">패널 두께</text><text x="550" y="751" font-size="23" fill="#14364b" text-anchor="start">16 mm</text><rect x="80" y="766" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="798" font-size="22" fill="#14364b" text-anchor="start">포장 수량</text><text x="550" y="798" font-size="23" fill="#14364b" text-anchor="start">8장 / BOX</text><rect x="80" y="813" width="1040" height="47" fill="#fff"/><text x="105" y="845" font-size="22" fill="#14364b" text-anchor="start">시공 면적</text><text x="550" y="845" font-size="23" fill="#14364b" text-anchor="start">1.14 ㎡ / 장</text><rect x="80" y="860" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="892" font-size="22" fill="#14364b" text-anchor="start">제품 무게</text><text x="550" y="892" font-size="23" fill="#14364b" text-anchor="start">약 4.1 kg / 장</text><text x="80" y="974" font-size="20" fill="#587082" text-anchor="start">발주 전 적용 모델과 제작 규격을 확인해 주세요.</text><text x="80" y="1009" font-size="18" fill="#587082" text-anchor="start">규격 출처: HN METALLIC · 안내도 제작: 신명건설</text></g></svg>