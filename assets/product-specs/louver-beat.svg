<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1022" viewBox="0 0 1200 1022" role="img" aria-labelledby="title desc"><title id="title">비트루버강판 규격 안내</title><desc id="desc">전체폭 350 mm, 유효폭 285 mm, 골 상부폭 70 / 30 / 30 / 50 mm, 골 사이 간격 25 mm, 골 높이 20 mm, 강판 두께 0.5T</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ae8439"/></marker></defs><rect width="1200" height="1022" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="80" y="65" font-size="17" fill="#9b742f" text-anchor="start">SHINMYEONG CONSTRUCTION</text><text x="80" y="120" font-size="38" fill="#14364b" text-anchor="start">비트루버강판 규격 안내</text><text x="80" y="163" font-size="20" fill="#587082" text-anchor="start">제조사 공개 규격 기준 · 단위 mm · 형상 이해를 위한 개념도 (비례 아님)</text><path d="M180 340 H215 V285 H374.38461538461536 V340 H439.38461538461536 V285 H507.6923076923077 V340 H572.6923076923076 V285 H640.9999999999999 V340 H705.9999999999999 V285 H819.8461538461538 V340 H884.8461538461538 H990" fill="none" stroke="#214b61" stroke-width="5" stroke-linejoin="round"/><path d="M180 220L990 220" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="585" y="205" font-size="24" fill="#805a19" text-anchor="middle">전체폭 350 mm</text><path d="M205 440L955 440" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="580" y="425" font-size="24" fill="#805a19" text-anchor="middle">유효폭 285 mm</text><path d="M1035 285L1035 340" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1053" y="312.5" font-size="24" fill="#805a19" text-anchor="start">20 mm</text><text x="600" y="510" font-size="25" fill="#587082" text-anchor="middle">골 상부폭 70 / 30 / 30 / 50 mm</text><rect x="80" y="578" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="610" font-size="22" fill="#14364b" text-anchor