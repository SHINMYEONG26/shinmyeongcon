<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc"><title id="title">메탈사이딩 부자재 규격 안내</title><desc id="desc">스타터 길이 3,000 mm, 결합형 조이너 길이 3,000 mm, J찬넬 길이 3,000 mm, 아웃코너 길이 3,000 mm</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ae8439"/></marker></defs><rect width="1200" height="928" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="80" y="65" font-size="17" fill="#9b742f" text-anchor="start">SHINMYEONG CONSTRUCTION</text><text x="80" y="120" font-size="38" fill="#14364b" text-anchor="start">메탈사이딩 부자재 규격 안내</text><text x="80" y="163" font-size="20" fill="#587082" text-anchor="start">제조사 공개 규격 기준 · 단위 mm · 형상 이해를 위한 개념도 (비례 아님)</text><path d="M0 0 V65 H75 V10" transform="translate(160 280)" fill="none" stroke="#214b61" stroke-width="7"/><text x="192" y="390" font-size="24" fill="#14364b" text-anchor="middle">스타터</text><path d="M0 0 H70 V65 H0 M35 0 V65" transform="translate(420 280)" fill="none" stroke="#214b61" stroke-width="7"/><text x="452" y="390" font-size="24" fill="#14364b" text-anchor="middle">결합형 조이너</text><path d="M0 0 V65 H70 V15" transform="translate(680 280)" fill="none" stroke="#214b61" stroke-width="7"/><text x="712" y="390" font-size="24" fill="#14364b" text-anchor="middle">J찬넬</text><path d="M0 65 V0 H65 V65" transform="translate(940 280)" fill="none" stroke="#214b61" stroke-width="7"/><text x="972" y="390" font-size="24" fill="#14364b" text-anchor="middle">아웃코너</text><text x="600" y="465" font-size="30" fill="#805a19" text-anchor="middle">각 부자재 길이 3,000 mm</text><rect x="80" y="578" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="610" font-size="22" fill="#14364b" text-anchor="start">스타터 길이</text><text x="550" y="610" font-size="23" fill="#14364b" text-anchor="start">3,000 mm</text><rect x="80" y="625" width="1040" height="47" fill="#fff"/><text x="105" y="657" font-size="22" fill="#14364b" text-anchor="start">결합형 조이너 길이</text><text x="550" y="657" font-size="23" fill="#14364b" text-anchor="start">3,000 mm</text><rect x="80" y="672" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="704" font-size="22" fill="#14364b" text-anchor="start">J찬넬 길이</text><text x="550" y="704" font-size="23" fill="#14364b" text-anchor="start">3,000 mm</text><rect x="80" y="719" width="1040" height="47" fill="#fff"/><text x="105" y="751" font-size="22" fill="#14364b" text-anchor="start">아웃코너 길이</text><text x="550" y="751" font-size="23" fill="#14364b" text-anchor="start">3,000 mm</text><text x="80" y="833" font-size="20" fill="#587082" text-anchor="start">발주 전 적용 모델과 제작 규격을 확인해 주세요.</text><text x="80" y="868" font-size="18" fill="#587082" text-anchor="start">규격 출처: HN METALLIC · 안내도 제작: 신명건설</text></g></svg>