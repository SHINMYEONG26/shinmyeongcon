<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc"><title id="title">인터락징크 규격 안내</title><desc id="desc">전체폭 410 mm, 유효폭 370 mm, 골 높이 25 mm, 강판 두께 0.5T</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ae8439"/></marker></defs><rect width="1200" height="928" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="80" y="65" font-size="17" fill="#9b742f" text-anchor="start">SHINMYEONG CONSTRUCTION</text><text x="80" y="120" font-size="38" fill="#14364b" text-anchor="start">인터락징크 규격 안내</text><text x="80" y="163" font-size="20" fill="#587082" text-anchor="start">제조사 공개 규격 기준 · 단위 mm · 형상 이해를 위한 개념도 (비례 아님)</text><path d="M180 340 h18 v-55 h20 v55 H960 v-55 h18 v55 h12" fill="none" stroke="#214b61" stroke-width="5" stroke-linejoin="round"/><path d="M180 220L990 220" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="585" y="205" font-size="24" fill="#805a19" text-anchor="middle">전체폭 410 mm</text><path d="M205 440L955 440" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="580" y="425" font-size="24" fill="#805a19" text-anchor="middle">유효폭 370 mm</text><path d="M1035 285L1035 340" stroke="#ae8439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1053" y="312.5" font-size="24" fill="#805a19" text-anchor="start">25 mm</text><rect x="80" y="578" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="610" font-size="22" fill="#14364b" text-anchor="start">전체폭</text><text x="550" y="610" font-size="23" fill="#14364b" text-anchor="start">410 mm</text><rect x="80" y="625" width="1040" height="47" fill="#fff"/><text x="105" y="657" font-size="22" fill="#14364b" text-anchor="start">유효폭</text><text x="550" y="657" font-size="23" fill="#14364b" text-anchor="start">370 mm</text><rect x="80" y="672" width="1040" height="47" fill="#f0f4f7"/><text x="105" y="704" font-size="22" fill="#14364b" text-anchor="start">골 높이</text><text x="550" y="704" font-size="23" fill="#14364b" text-anchor="start">25 mm</text><rect x="80" y="719" width="1040" height="47" fill="#fff"/><text x="105" y="751" font-size="22" fill="#14364b" text-anchor="start">강판 두께</text><text x="550" y="751" font-size="23" fill="#14364b" text-anchor="start">0.5T</text><text x="80" y="833" font-size="20" fill="#587082" text-anchor="start">제조사 자료 표기 오차 범위 ±10 mm</text><text x="80" y="868" font-size="18" fill="#587082" text-anchor="start">규격 출처: HN METALLIC · 안내도 제작: 신명건설</text></g></svg>