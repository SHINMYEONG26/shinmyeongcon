<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-label="일반 인터락징크와 열반사 인터락징크 구성 비교"><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e2684b" stroke-width="2"/></marker></defs><rect width="1200" height="825" fill="white"/><g font-family="Malgun Gothic,sans-serif"><text x="70" y="65" fill="#9b773c" font-size="17" text-anchor="start">PRODUCT STRUCTURE</text><text x="70" y="125" fill="#17384d" font-size="38" text-anchor="start">인터락 마감에 열반사층을 더한 구성</text><text x="70" y="173" fill="#697e8b" font-size="22" text-anchor="start">제조사 표기 규격을 기준으로 비교합니다.</text><rect x="70" y="220" width="500" height="390" rx="14" fill="#f0f4f7"/><text x="98" y="270" fill="#17384d" font-size="29" text-anchor="start">일반 홑판 인터락징크</text><text x="98" y="315" fill="#9b773c" font-size="24" text-anchor="start">강판 두께 표기 0.5T</text><path d="M115 410v-40h15v40h360v-40h15v40" fill="none" stroke="#415463" stroke-width="10"/><text x="320" y="505" fill="#17384d" font-size="24" text-anchor="middle">단일 금속판 구성</text><text x="320" y="550" fill="#697e8b" font-size="21" text-anchor="middle">별도 단열 구성은 현장에서 검토</text><rect x="630" y="220" width="500" height="390" rx="14" fill="#f0f4f7"/><text x="658" y="270" fill="#17384d" font-size="29" text-anchor="start">열반사 인터락징크</text><text x="658" y="315" fill="#9b773c" font-size="24" text-anchor="start">제품 두께 표기 3T</text><path d="M675 410v-40h15v40h360v-40h15v40" fill="none" stroke="#415463" stroke-width="10"/><rect x="692" y="421" width="356" height="22" fill="#6e7880"/><rect x="692" y="443" width="356" height="7" fill="#c6d2da"/><text x="880" y="505" fill="#17384d" font-size="24" text-anchor="middle">금속판 뒷면 + 열반사 시트</text><text x="880" y="550" fill="#697e8b" font-size="22" text-anchor="middle">열융착 방식으로 결합</text><text x="70" y="678" fill="#17384d" font-size="26" text-anchor="start">인터락의 연결 형상은 유지하고, 뒷면에 열반사 기능을 더합니다.</text><text x="70" y="730" fill="#697e8b" font-size="21" text-anchor="start">0.5T와 3T는 제조사의 두께 표기입니다. 두께만으로 단열 성능을 비교할 수 없습니다.</text><text x="70" y="775" fill="#697e8b" font-size="20" text-anchor="start">단면은 이해를 위한 개념도이며, 재료별 두께 비율은 실제와 다릅니다.</text></g></svg>