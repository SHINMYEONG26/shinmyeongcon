<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="열반사 인터락징크 계절별 열반사 원리"><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e2684b" stroke-width="2"/></marker></defs><rect width="1200" height="880" fill="white"/><g font-family="Malgun Gothic,sans-serif"><text x="70" y="65" fill="#9b773c" font-size="17" text-anchor="start">METALEX · THERMAL REFLECTIVE INTERLOCK</text><text x="70" y="125" fill="#17384d" font-size="37" text-anchor="start">계절에 따른 열 이동, 열반사층으로 보완합니다</text><rect x="70" y="170" width="500" height="500" rx="16" fill="#fff4e7"/><text x="98" y="220" fill="#17384d" font-size="25" text-anchor="start">겨울 · 보온을 고려한 구성</text><text x="98" y="265" fill="#697e8b" font-size="21" text-anchor="start">실내 → 외부로 향하는 복사열</text><path d="M180 520V420L320 310L460 420V520Z" fill="#f6d6ae" stroke="#577185" stroke-width="6"/><path d="M190 425L320 323L450 425" fill="none" stroke="#bdc8ce" stroke-width="12"/><path d="M200 429L320 336L440 429" fill="none" stroke="#d7ad53" stroke-width="5"/><path d="M315 470L257 408L316 428" fill="none" stroke="#e2684b" stroke-width="4" marker-end="url(#red)"/><text x="320" y="563" fill="#17384d" font-size="25" text-anchor="middle">겨울철 실내 보온 검토</text><text x="320" y="610" fill="#61798b" font-size="17" text-anchor="middle">실내 복사열의 이동을 줄이는 방향으로 보완</text><rect x="630" y="170" width="500" height="500" rx="16" fill="#edf5fc"/><text x="658" y="220" fill="#17384d" font-size="25" text-anchor="start">여름 · 외부 열 유입을 고려한 구성</text><text x="658" y="265" fill="#697e8b" font-size="21" text-anchor="start">외부 → 실내로 향하는 복사열</text><path d="M740 520V420L880 310L1020 420V520Z" fill="#d2e8f7" stroke="#577185" stroke-width="6"/><path d="M750 425L880 323L1010 425" fill="none" stroke="#bdc8ce" stroke-width="12"/><path d="M760 429L880 336L1000 429" fill="none" stroke="#d7ad53" stroke-width="5"/><circle cx="1020" cy="330" r="29" fill="#efaa4a"/><path d="M1045 375L959 390L985 345" fill="none" stroke="#e2684b" stroke-width="4" marker-end="url(#red)"/><text x="880" y="563" fill="#17384d" font-size="25" text-anchor="middle">여름철 냉방 환경 검토</text><text x="880" y="610" fill="#61798b" font-size="17" text-anchor="middle">외부 복사열의 실내 유입을 줄이는 방향으로 보완</text><text x="70" y="735" fill="#17384d" font-size="25" text-anchor="start">제품 뒷면의 알루미늄 열반사 시트가 복사열 이동을 줄이는 역할을 합니다.</text><text x="70" y="785" fill="#697e8b" font-size="22" text-anchor="start">열반사층의 효과는 공기층, 바탕 구조, 기존 단열재와 시공 상태에 따라 달라집니다.</text><text x="70" y="835" fill="#697e8b" font-size="20" text-anchor="start">원리 이해를 위한 개념도 · 실제 온도 차이나 냉난방비 절감률을 나타내지 않습니다.</text></g></svg>